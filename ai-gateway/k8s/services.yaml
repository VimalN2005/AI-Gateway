apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-service
  namespace: ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nlp-service
  template:
    metadata:
      labels:
        app: nlp-service
    spec:
      containers:
        - name: nlp-service
          image: nlp-service:latest
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-service
  namespace: ai-gateway
spec:
  selector:
    app: nlp-service
  ports:
    - port: 5001
      targetPort: 5001
---
